<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — a tiny browser game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07070f;
    color: #e8f6e8;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
  }
  h1 {
    font-size: 30px;
    letter-spacing: 6px;
    color: #a4ff4f;
    text-shadow: 0 0 18px rgba(164, 255, 79, 0.8);
  }
  h1 span { color: #ff2e88; text-shadow: 0 0 18px rgba(255, 46, 136, 0.8); }
  #hud {
    width: 600px;
    max-width: 96vw;
    display: flex;
    justify-content: space-between;
    font-family: "Consolas", "SF Mono", monospace;
    font-size: 18px;
    color: #9be7ff;
  }
  #hud b { color: #ffffff; }
  canvas {
    background: #0a0a16;
    border: 2px solid #1d2b45;
    border-radius: 8px;
    box-shadow: 0 0 32px rgba(46, 160, 255, 0.25);
    width: 600px;
    max-width: 96vw;
    height: auto;
    display: block;
  }
  #hint { font-size: 14px; color: #7d8aa5; }
  #hint b { color: #c8d6ea; }
</style>
</head>
<body>
  <h1>NEON <span>SNAKE</span></h1>
  <div id="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
  <canvas id="game" width="600" height="400"></canvas>
  <p id="hint"><b>Arrow keys / WASD</b> to steer &nbsp;·&nbsp; <b>P</b> to pause &nbsp;·&nbsp; <b>Space</b> to restart &nbsp;·&nbsp; eat orbs, dodge walls and your own tail</p>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var CELL = 20, COLS = 30, ROWS = 20;
  var best = 0;
  try { best = parseInt(localStorage.getItem("neon-snake-best") || "0", 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  var snake, dir, pendingDir, food, score, alive, speed, lastStep, acc, paused;

  function reset() {
    snake = [{ x: 15, y: 10 }, { x: 14, y: 10 }, { x: 13, y: 10 }];
    dir = { x: 1, y: 0 };
    pendingDir = dir;
    score = 0;
    alive = true;
    speed = 8;
    acc = 0;
    lastStep = 0;
    scoreEl.textContent = "0";
    spawnFood();
  }

  function spawnFood() {
    var free = [];
    for (var x = 0; x < COLS; x++) {
      for (var y = 0; y < ROWS; y++) {
        var onSnake = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { onSnake = true; break; }
        }
        if (!onSnake) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function step() {
    if (!alive) return;
    dir = pendingDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) { die(); return; }
    var eating = food && head.x === food.x && head.y === food.y;
    // The tail vacates its cell on a non-eating move, so it is not deadly then.
    var checkLen = eating ? snake.length : snake.length - 1;
    for (var i = 0; i < checkLen; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) { die(); return; }
    }
    snake.unshift(head);
    if (eating) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("neon-snake-best", String(best)); } catch (e) {}
      }
      if (speed < 16) speed += 0.25;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
  }

  function draw(now) {
    ctx.fillStyle = "#0a0a16";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(90, 120, 180, 0.12)";
    ctx.lineWidth = 1;
    for (var gx = 1; gx < COLS; gx++) {
      ctx.beginPath(); ctx.moveTo(gx * CELL, 0); ctx.lineTo(gx * CELL, canvas.height); ctx.stroke();
    }
    for (var gy = 1; gy < ROWS; gy++) {
      ctx.beginPath(); ctx.moveTo(0, gy * CELL); ctx.lineTo(canvas.width, gy * CELL); ctx.stroke();
    }
    if (food) {
      var pulse = 1 + 0.18 * Math.sin(now / 160);
      var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
      var grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, 12 * pulse);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.35, "#ff5ea8");
      grad.addColorStop(1, "rgba(255, 46, 136, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(fx, fy, 12 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff2e88";
      ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
    }
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = snake.length > 1 ? i / (snake.length - 1) : 0;
      var r = Math.round(164 - t * 120), g = Math.round(255 - t * 90), b = Math.round(79 + t * 150);
      ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
      ctx.shadowColor = "rgba(120, 255, 120, 0.9)";
      ctx.shadowBlur = i === 0 ? 18 : 10;
      roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 6);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    var head = snake[0];
    var ex = head.x * CELL + CELL / 2, ey = head.y * CELL + CELL / 2;
    var ox = dir.x * 5, oy = dir.y * 5;
    ctx.fillStyle = "#0a0a16";
    ctx.beginPath(); ctx.arc(ex + ox - oy * 0.7, ey + oy - ox * 0.7, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + ox + oy * 0.7, ey + oy + ox * 0.7, 2.6, 0, Math.PI * 2); ctx.fill();
    if (!alive) {
      ctx.fillStyle = "rgba(5, 5, 12, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff5a5a";
      ctx.font = "bold 44px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(255, 60, 60, 0.9)";
      ctx.shadowBlur = 22;
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 14);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffffff";
      ctx.font = "20px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("Score " + score + "  ·  Best " + best, canvas.width / 2, canvas.height / 2 + 24);
      ctx.fillStyle = "#9be7ff";
      ctx.font = "16px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("Press SPACE to play again", canvas.width / 2, canvas.height / 2 + 56);
    }
    if (paused && alive) {
      ctx.fillStyle = "rgba(5, 5, 12, 0.6)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#9be7ff";
      ctx.font = "bold 36px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
      ctx.fillStyle = "#ffffff";
      ctx.font = "16px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("Press P to resume", canvas.width / 2, canvas.height / 2 + 32);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var DIRS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
  };

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter") {
      if (!alive) { reset(); }
      e.preventDefault();
      return;
    }
    if (e.code === "KeyP" || e.code === "Escape") {
      if (alive) { paused = !paused; }
      e.preventDefault();
      return;
    }
    var next = DIRS[e.code];
    if (!next) return;
    if (next.x === -dir.x && next.y === -dir.y) return;
    if (next.x === -pendingDir.x && next.y === -pendingDir.y) return;
    pendingDir = next;
    e.preventDefault();
  });

  canvas.addEventListener("click", function () {
    if (!alive) reset();
  });

  function loop(now) {
    if (!lastStep) lastStep = now;
    if (!paused) {
      acc += now - lastStep;
      var interval = 1000 / speed;
      var guard = 0;
      while (acc >= interval && guard < 5) {
        step();
        acc -= interval;
        guard++;
      }
    }
    lastStep = now;
    draw(now);
    requestAnimationFrame(loop);
  }

  window.__snake = {
    state: function () {
      return { snake: snake, food: food, dir: dir, score: score, best: best, alive: alive, cols: COLS, rows: ROWS, speed: speed };
    },
    reset: reset,
    step: step,
    pause: function (v) { paused = !!v; }
  };

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
